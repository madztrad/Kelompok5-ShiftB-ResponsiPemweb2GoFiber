<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barang — SimInventaris</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="navbar"></div>
  <main class="mx-auto max-w-6xl px-4 py-8 space-y-6">
    <h1 class="text-2xl font-bold">Manajemen Barang</h1>
    <div id="alert-box" class="hidden"></div>

    <div id="detail-box" class="hidden rounded-xl border border-sky-200 bg-sky-50 p-4 text-sm">
      <div class="flex justify-between items-start gap-4">
        <div id="detail-content"></div>
        <button onclick="document.getElementById('detail-box').classList.add('hidden')" class="text-xs underline">Tutup</button>
      </div>
    </div>

    <section id="admin-form-panel" class="hidden rounded-xl border border-slate-200 bg-white p-6">
      <h2 id="form-title" class="text-lg font-semibold mb-4">Tambah Barang</h2>
      <form id="barang-form" class="grid gap-4 md:grid-cols-3">
        <input type="hidden" id="barang-id" />
        <div>
          <label class="block text-sm font-medium mb-1">Kode Barang</label>
          <input type="text" id="kode_barang" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="LAB-001" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Nama Barang</label>
          <input type="text" id="nama" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Oscilloscope Digital" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Kategori</label>
          <select id="kategori_id" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Stok</label>
          <input type="number" id="stok" min="0" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" value="1" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Kondisi</label>
          <select id="kondisi" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
            <option value="baik">Baik</option>
            <option value="rusak_ringan">Rusak Ringan</option>
            <option value="rusak_berat">Rusak Berat</option>
          </select>
        </div>
        <div class="md:col-span-3 flex gap-2">
          <button type="submit" id="btn-save" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Simpan</button>
          <button type="button" id="btn-reset" class="rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100">Reset</button>
        </div>
      </form>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white p-4">
      <form id="filter-form" class="grid gap-3 md:grid-cols-4">
        <input type="text" id="search" placeholder="Cari nama atau kode barang..." class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        <select id="filter-kategori" class="rounded-lg border border-slate-300 px-3 py-2 text-sm"></select>
        <select id="filter-kondisi" class="rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option value="">Semua Kondisi</option>
          <option value="baik">Baik</option>
          <option value="rusak_ringan">Rusak Ringan</option>
          <option value="rusak_berat">Rusak Berat</option>
        </select>
        <button type="submit" class="rounded-lg bg-slate-800 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700">Cari / Filter</button>
      </form>
    </section>

    <section class="overflow-x-auto rounded-xl border border-slate-200 bg-white">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 text-slate-600">
          <tr>
            <th class="px-4 py-3">Kode</th>
            <th class="px-4 py-3">Nama</th>
            <th class="px-4 py-3">Kategori</th>
            <th class="px-4 py-3">Stok</th>
            <th class="px-4 py-3">Kondisi</th>
            <th class="px-4 py-3 text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="barang-tbody"></tbody>
      </table>
      <div class="flex items-center justify-between border-t border-slate-200 px-4 py-3 text-sm">
        <span id="page-info" class="text-slate-600"></span>
        <div class="flex gap-2">
          <button id="btn-prev" class="rounded border border-slate-300 px-3 py-1 disabled:opacity-40">Sebelumnya</button>
          <button id="btn-next" class="rounded border border-slate-300 px-3 py-1 disabled:opacity-40">Berikutnya</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/barang.js"></script>
</body>
</html>
