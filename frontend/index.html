<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — SimInventaris</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="navbar"></div>
  <main class="mx-auto max-w-6xl px-4 py-8">
    <h1 class="text-2xl font-bold mb-2">Dashboard SimInventaris</h1>
    <p class="text-slate-600 mb-6">Pilih modul yang ingin dikelola:</p>
    <div class="grid gap-4 md:grid-cols-3">
      <a href="kategori.html" class="rounded-xl border border-slate-200 bg-white p-6 hover:border-slate-400">
        <h2 class="font-semibold text-lg mb-1">1. Kategori Barang</h2>
        <p class="text-sm text-slate-600">Kelola master kategori inventaris (CRUD oleh Admin).</p>
      </a>
      <a href="barang.html" class="rounded-xl border border-slate-200 bg-white p-6 hover:border-slate-400">
        <h2 class="font-semibold text-lg mb-1">2. Data Barang</h2>
        <p class="text-sm text-slate-600">Daftar inventaris, pencarian, filter kondisi, dan pagination.</p>
      </a>
      <a href="peminjaman.html" class="rounded-xl border border-slate-200 bg-white p-6 hover:border-slate-400">
        <h2 class="font-semibold text-lg mb-1">3. Peminjaman</h2>
        <p class="text-sm text-slate-600">Ajukan peminjaman barang dan pantau status pengembalian.</p>
      </a>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    if (requireAuth()) renderNavbar("dashboard");
  </script>
</body>
</html>
