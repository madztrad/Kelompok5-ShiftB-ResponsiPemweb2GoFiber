<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kategori — SimInventaris</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="navbar"></div>
  <main class="mx-auto max-w-6xl px-4 py-8 space-y-6">
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold">Manajemen Kategori</h1>
    </div>

    <div id="alert-box" class="hidden"></div>

    <div id="detail-box" class="hidden rounded-xl border border-sky-200 bg-sky-50 p-4 text-sm">
      <div class="flex justify-between items-start gap-4">
        <div id="detail-content"></div>
        <button onclick="document.getElementById('detail-box').classList.add('hidden')" class="text-xs underline">Tutup</button>
      </div>
    </div>

    <section id="admin-form-panel" class="hidden rounded-xl border border-slate-200 bg-white p-6">
      <h2 id="form-title" class="text-lg font-semibold mb-4">Tambah Kategori</h2>
      <form id="kategori-form" class="grid gap-4 md:grid-cols-2">
        <input type="hidden" id="kategori-id" />
        <div>
          <label class="block text-sm font-medium mb-1">Nama Kategori</label>
          <input type="text" id="nama" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Elektronik" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Deskripsi</label>
          <input type="text" id="deskripsi" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Perangkat elektronik lab" />
        </div>
        <div class="md:col-span-2 flex gap-2">
          <button type="submit" id="btn-save" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Simpan</button>
          <button type="button" id="btn-reset" class="rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100">Reset</button>
        </div>
      </form>
    </section>

    <section class="overflow-x-auto rounded-xl border border-slate-200 bg-white">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 text-slate-600">
          <tr>
            <th class="px-4 py-3">ID</th>
            <th class="px-4 py-3">Nama</th>
            <th class="px-4 py-3">Deskripsi</th>
            <th class="px-4 py-3 text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="kategori-tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/kategori.js"></script>
</body>
</html>
