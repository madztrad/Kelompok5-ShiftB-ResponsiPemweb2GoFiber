<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SimInventaris</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold mb-1">Masuk SimInventaris</h1>
    <p class="text-sm text-slate-600 mb-6">Gunakan akun terdaftar atau akun demo dari README.</p>
    <div id="alert-box" class="hidden"></div>
    <form id="login-form" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium mb-1">Email</label>
        <input type="email" id="email" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="admin@lab.test" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium mb-1">Password</label>
        <input type="password" id="password" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="••••••••" />
      </div>
      <button type="submit" id="btn-submit" class="w-full rounded-lg bg-slate-900 py-2.5 text-sm font-semibold text-white hover:bg-slate-800">
        Masuk
      </button>
    </form>
    <p class="mt-4 text-center text-sm text-slate-600">
      Belum punya akun? <a href="register.html" class="font-semibold text-slate-900 underline">Daftar di sini</a>
    </p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
