<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrasi — SimInventaris</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold mb-1">Daftar Akun Baru</h1>
    <p class="text-sm text-slate-600 mb-6">Akun publik otomatis terdaftar dengan role member.</p>
    <div id="alert-box" class="hidden"></div>
    <form id="register-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
        <input type="text" id="nama" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" id="email" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" id="password" required minlength="6" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <button type="submit" id="btn-submit" class="w-full rounded-lg bg-slate-900 py-2.5 text-sm font-semibold text-white hover:bg-slate-800">
        Daftar
      </button>
    </form>
    <p class="mt-4 text-center text-sm text-slate-600">
      Sudah punya akun? <a href="login.html" class="font-semibold text-slate-900 underline">Masuk</a>
    </p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
